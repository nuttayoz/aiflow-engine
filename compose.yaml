services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: aiflow
      POSTGRES_PASSWORD: local-bootstrap-only
      POSTGRES_USER: aiflow_bootstrap
    ports:
      - '127.0.0.1:${AIFLOW_POSTGRES_PORT:-55439}:5432'
    volumes:
      - aiflow-postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "PGPASSWORD=local-application-only psql --no-password --username=aiflow_app --dbname=aiflow --command='SELECT 1' >/dev/null",
        ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.2-management
    environment:
      RABBITMQ_DEFAULT_PASS: local-rabbitmq-only
      RABBITMQ_DEFAULT_USER: aiflow_app
      RABBITMQ_DEFAULT_VHOST: aiflow
    ports:
      - '127.0.0.1:${AIFLOW_RABBITMQ_PORT:-55672}:5672'
      - '127.0.0.1:${AIFLOW_RABBITMQ_MANAGEMENT_PORT:-55673}:15672'
    volumes:
      - aiflow-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  s3:
    image: motoserver/moto:5.2.2
    ports:
      - '127.0.0.1:${AIFLOW_S3_PORT:-55674}:5000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:5000/moto-api/'')"',
        ]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  s3-init:
    image: motoserver/moto:5.2.2
    entrypoint: ['python']
    command: ['/init/create_bucket.py']
    environment:
      AWS_ACCESS_KEY_ID: local-moto-only
      AWS_SECRET_ACCESS_KEY: local-moto-only
      AWS_DEFAULT_REGION: us-east-1
      AIFLOW_S3_BUCKET: aiflow-local
      AIFLOW_S3_ENDPOINT: http://s3:5000
    volumes:
      - ./infra/moto/init:/init:ro
    depends_on:
      s3:
        condition: service_healthy
    restart: 'no'

volumes:
  aiflow-postgres-data:
  aiflow-rabbitmq-data:
